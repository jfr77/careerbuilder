name: Deploy frontend to GitHub Pages

# Builds the Vite frontend and publishes frontend/dist to GitHub Pages.
# The backend is NOT deployed here — it runs on Render (see render.yaml).
#
# Configure these in the repo before the first run:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Secrets and variables → Actions → Variables:
#     VITE_API_URL            https://<your-service>.onrender.com
#     VITE_SUPABASE_URL       https://<project-ref>.supabase.co
#     VITE_SUPABASE_ANON_KEY  <anon public key>
#     VITE_BASE               /<repo-name>/        (e.g. /carreerbuilder/)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
